<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F6D3DF"/>
      <stop offset="1" stop-color="#E8A9BF"/>
    </linearGradient>
    <linearGradient id="laco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D07590"/>
      <stop offset="1" stop-color="#B85C7A"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#fundo)"/>

  <path d="M160 860 c-12-18-38-19-38-1 c0 12 22 25 38 33 c16-8 38-21 38-33 c0-18-26-17-38 1z" fill="#FFFFFF" opacity="0.4"/>
  <path d="M930 830 c-10-15-32-16-32-1 c0 10 19 21 32 28 c13-7 32-18 32-28 c0-15-22-14-32 1z" fill="#FFFFFF" opacity="0.4"/>
